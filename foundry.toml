[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
via_ir = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "fhevm/=contracts/fhevm/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
